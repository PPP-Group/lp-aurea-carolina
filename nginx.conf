# ==============================================================================
# NGINX · serve o build estático
# ------------------------------------------------------------------------------
# Cache dividido em dois regimes, porque nem todo arquivo em /assets tem o
# mesmo contrato:
#
#   JS e CSS   — o Vite grava um hash de conteúdo no nome do arquivo
#                (index-Bl9B4WUP.js). Se o conteúdo mudar, o nome muda junto.
#                Por isso podem ficar em cache por 1 ano sem risco: um deploy
#                novo nunca reaproveita o nome de um arquivo velho.
#
#   Imagens, fontes, favicon
#                — o nome NÃO carrega hash (aurea-terracota.webp continua se
#                chamando aurea-terracota.webp depois de qualquer edição).
#                Cache de 1 ano aqui faria o navegador nunca buscar a versão
#                nova. Ficam em 7 dias, tempo suficiente pra aliviar releitura
#                sem prender o site numa foto trocada.
#
#   index.html — nunca em cache. É o arquivo que aponta pro JS/CSS com hash
#                do deploy atual; se ele ficar preso em cache, a página carrega
#                a casca antiga e passa a referenciar bundles que já saíram do
#                servidor. Isso sozinho já produz tela em branco depois de um
#                deploy novo.
# ==============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    add_header X-Content-Type-Options nosniff always;

    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Vídeo e áudio: fora do gzip (já são formatos comprimidos, e comprimir de
    # novo só atrapalha o pedido por faixa) e servidos com `Accept-Ranges`, que
    # o nginx manda sozinho para arquivo estático. É esse pedido por faixa que
    # faz o vídeo começar a tocar nos primeiros segundos em vez de esperar o
    # arquivo inteiro — e é obrigatório no Safari do iPhone.
    location ~* \.(?:mp4|m4v|webm|mov|mp3|m4a)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        gzip off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2|webp|svg|png|jpe?g|ico)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # SPA de página única: qualquer rota que não bata em arquivo real cai no
    # index.html. Sem isto, um refresh em qualquer estado da página (ou o
    # health check da plataforma de deploy) devolve 404 em vez do site.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
