# ==============================================================================
# NIXPACKS · configuração de build e runtime
# ------------------------------------------------------------------------------
# O EasyPanel builda este projeto com Nixpacks (Build Method: Nixpacks).
# Builda o projeto Vite + React e serve a pasta dist/ usando o Caddyfile da raiz.
# ==============================================================================

[variables]
NODE_ENV = 'production'
NPM_CONFIG_PRODUCTION = 'false'
CI = 'true'
NIXPACKS_SPA_OUT_DIR = 'dist'
NIXPACKS_SPA_OUTPUT_DIR = 'dist'

[phases.setup]
nixPkgs = ['caddy']

[phases.build]
cmds = ['npm run build']

[start]
cmd = 'caddy run --config Caddyfile --adapter caddyfile'

