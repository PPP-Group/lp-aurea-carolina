# ==============================================================================
# NIXPACKS · variáveis da imagem final
# ------------------------------------------------------------------------------
# O EasyPanel builda este projeto com Nixpacks (Build Method: Nixpacks). O
# Nixpacks detecta Vite + React e serve o site com Caddy como SPA.
#
# A variável oficial do Nixpacks para definir o diretório estático é:
#     NIXPACKS_SPA_OUT_DIR = 'dist'
#
# Se essa variável faltar ou estiver com nome incorreto, o Caddy monta a raiz
# em /app (código-fonte), servindo o index.html de dev com <script src="/src/main.jsx">
# e causando erro de MIME type no navegador.
# ==============================================================================

[variables]
NODE_ENV = 'production'
NPM_CONFIG_PRODUCTION = 'false'
CI = 'true'
NIXPACKS_SPA_OUT_DIR = 'dist'
NIXPACKS_SPA_OUTPUT_DIR = 'dist'
